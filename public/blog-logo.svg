  <desc id="logoDesc">A rounded square with code brackets and a diagonal accent stroke.</desc>
  <defs>
    <linearGradient id="logoTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
      }
      .container {
        text-align: center;
        padding: 60px;
      }
      h1 {
        font-size: 48px;
        font-weight: 800;
        margin: 0 0 20px 0;
        line-height: 1.2;
      }
      p {
        font-size: 24px;
        margin: 0;
        opacity: 0.9;
      }
      .logo {
        font-size: 32px;
        margin-bottom: 30px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">Learn Coding First</div>
      <h1>Programming & AI Tutorials</h1>
      <p>Master coding fundamentals, AI tools, and developer skills</p>
    </div>
  </body>
</html>

name = "learn-coding-first"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "blog-auth-db"
database_id = "2805ff1f-f04f-4446-8473-ba54ad3832b4"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "SESSION"
id = "b3bf4da7a0784275b628780e8354875c"

[[cron_triggers]]
cron = "0 0 * * *"

[vars]
# BETTER_AUTH_URL is set via .dev.vars (local) and wrangler secret (production)
# Do NOT put it here — [vars] takes precedence over .dev.vars
